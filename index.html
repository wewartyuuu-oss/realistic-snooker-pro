
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Realistic Snooker Pro 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101713;color:#f5f2e8;font-family:Arial,sans-serif}
header{padding:12px 16px;background:#17251c;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:21px;color:#e6c56d;margin:0}
main{max-width:1100px;margin:auto;padding:12px}
#game{height:min(64vh,600px);min-height:340px;background:#080d09;border-radius:12px;overflow:hidden;touch-action:none}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:#1b2a20;border:1px solid #344638;border-radius:12px;padding:14px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.score{font-size:28px;color:#e6c56d;font-weight:bold}
#status{margin-top:12px;background:#101713;padding:12px;border-radius:8px;line-height:1.5}
button{border:0;border-radius:8px;background:#e6c56d;color:#152016;font-weight:bold;padding:11px 14px}
small{color:#bfccbf}
</style>
</head>
<body>
<header>
  <h1>🎱 Realistic Snooker Pro 3D</h1>
  <small>3D Table • Animated Player</small>
</header>
<main>
  <div id="game"></div>
  <div class="panel">
    <div class="row">
      <div>ผู้เล่น 1<div id="s0" class="score">0</div></div>
      <div>ผู้เล่น 2<div id="s1" class="score">0</div></div>
      <div>ตาของใคร<div id="turn">ผู้เล่น 1</div></div>
    </div>
    <div id="status">กำลังสร้างโต๊ะ 3D...</div>
    <p><button id="reset">เริ่มเฟรมใหม่</button></p>
    <small>ลากจากลูกขาวไปในทิศทางที่ต้องการ แล้วปล่อยเพื่อแทง ลากไกลขึ้นเพื่อเพิ่มแรงแทง ตัวผู้เล่นจะขยับตอนแทง</small>
  </div>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const host = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101713);
scene.fog = new THREE.Fog(0x101713, 18, 34);

const camera = new THREE.PerspectiveCamera(
  42, host.clientWidth / host.clientHeight, 0.1, 100
);
camera.position.set(0, 12.5, 13.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(host.clientWidth, host.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f0ff, 0x26301e, 2.1));
const light = new THREE.DirectionalLight(0xffedce, 3.2);
light.position.set(-5, 12, 7);
light.castShadow = true;
light.shadow.mapSize.set(2048,2048);
scene.add(light);

const mat=(color,roughness=.65)=>new THREE.MeshStandardMaterial({color,roughness});
const wood=mat(0x60371e),cloth=mat(0x12613c,.92);
const railMat=mat(0x174b30),black=mat(0x080a09);
const ballMaterials={
 Cue:mat(0xfff7e3,.22),Red:mat(0xc71927,.2),
 Yellow:mat(0xffd82f,.2),Green:mat(0x168446,.2),
 Brown:mat(0x754328,.2),Blue:mat(0x2675ed,.2),
 Pink:mat(0xf28ab6,.2),Black:mat(0x171717,.2)
};
const value={Red:1,Yellow:2,Green:3,Brown:4,Blue:5,Pink:6,Black:7};
const colorOrder=['Yellow','Green','Brown','Blue','Pink','Black'];
const ballRadius=.19, tableX=16, tableZ=8;
const innerX=7.35, innerZ=3.35;
const pockets=[
 [-7.55,-3.55],[0,-3.55],[7.55,-3.55],
 [-7.55,3.55],[0,3.55],[7.55,3.55]
];

function box(w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

// Room floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x172019));
floor.rotation.x=-Math.PI/2;floor.position.y=-.48;
floor.receiveShadow=true;scene.add(floor);

// Table body, cloth and rails
box(16,.55,8,wood,0,-.12,0);
box(15.5,.12,7.5,cloth,0,.20,0);
box(16,.30,.36,railMat,0,.34,-3.82);
box(16,.30,.36,railMat,0,.34,3.82);
box(.36,.30,7.3,railMat,-7.82,.34,0);
box(.36,.30,7.3,railMat,7.82,.34,0);

// Six dark pocket openings
for(const [x,z] of pockets){
 const hole=new THREE.Mesh(
  new THREE.CylinderGeometry(.34,.39,.035,32),black
 );
 hole.position.set(x,.267,z);scene.add(hole);
 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.34,.045,8,32),wood
 );
 rim.rotation.x=Math.PI/2;rim.position.set(x,.30,z);scene.add(rim);
}

// Baulk line and D
const lineMat=new THREE.LineBasicMaterial({color:0xe3d8b7});
function line(points,material=lineMat){
 const g=new THREE.BufferGeometry().setFromPoints(
  points.map(p=>new THREE.Vector3(p[0],.273,p[1]))
 );
 const m=new THREE.Line(g,material);scene.add(m);return m;
}
line([[-4.5,-3.55],[-4.5,3.55]]);
const dPts=[];
for(let i=0;i<=48;i++){
 const a=-Math.PI/2+i*Math.PI/48;
 dPts.push([-4.5+1.12*Math.cos(a),1.12*Math.sin(a)]);
}
line(dPts);

// Spots
const spots={
 Yellow:[-4.5,-2.75],Green:[-4.5,2.75],Brown:[-4.5,0],
 Blue:[0,0],Pink:[2.65,0],Black:[6.5,0]
};
for(const [x,z] of Object.values(spots)){
 const dot=new THREE.Mesh(new THREE.CircleGeometry(.045,16),mat(0xe7d8b3));
 dot.rotation.x=-Math.PI/2;dot.position.set(x,.276,z);scene.add(dot);
}

// Simple 3D player: body, head, legs and arms
const playerGroup=new THREE.Group();
playerGroup.position.set(-6.9,.27,1.05);
scene.add(playerGroup);
const skin=mat(0xc18a64),shirt=mat(0x202a37),trousers=mat(0x171b22);
function sphere(parent,r,material,pos){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material);
 m.position.set(...pos);m.castShadow=true;parent.add(m);return m;
}
function limb(parent,a,b,r,material){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const v=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),12),material);
 m.position.copy(A.add(B).multiplyScalar(.5));
 m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());
 m.castShadow=true;parent.add(m);return m;
}
const torso=new THREE.Group();playerGroup.add(torso);
limb(torso,[0,.7,0],[.35,1.55,0],.23,shirt);
sphere(torso,.22,skin,[.40,1.72,0]);
limb(playerGroup,[-.12,.6,-.12],[-.2,.12,-.2],.12,trousers);
limb(playerGroup,[.18,.6,.12],[.15,.12,.22],.12,trousers);
const arm=new THREE.Group();arm.position.set(.28,1.25,0);torso.add(arm);
limb(arm,[0,0,0],[.48,-.38,.12],.085,shirt);
limb(arm,[.48,-.38,.12],[.75,-.52,.02],.065,skin);
const secondArm=new THREE.Group();secondArm.position.set(.23,1.2,.15);torso.add(secondArm);
limb(secondArm,[0,0,0],[.45,-.35,.12],.075,shirt);
limb(secondArm,[.45,-.35,.12],[.76,-.48,.03],.055,skin);

// Cue stick
const cueMat=mat(0xc8a16c);
const cue=new THREE.Mesh(new THREE.CylinderGeometry(.035,.055,4.1,12),cueMat);
cue.castShadow=true;scene.add(cue);
const cueTip=new THREE.Mesh(new THREE.CylinderGeometry(.038,.038,.14,12),mat(0x3a3026));
scene.add(cueTip);

// Game state
let balls=[],score=[0,0],player=0,phase='reds',reds=15;
let clearanceIndex=0,aimPoint=null,dragging=false,moving=false;
let shot=null,gameOver=false,anim=null,last=performance.now();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const aimPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-.29);
const aimLine=new THREE.Line(
 new THREE.BufferGeometry(),
 new THREE.LineDashedMaterial({color:0xffe6a0,dashSize:.22,gapSize:.13})
);
scene.add(aimLine);
const hitRing=new THREE.Mesh(
 new THREE.TorusGeometry(.32,.025,8,32),
 new THREE.MeshBasicMaterial({color:0xffd36a})
);
hitRing.rotation.x=Math.PI/2;hitRing.visible=false;scene.add(hitRing);

function makeBall(type,x,z){
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(ballRadius,28,20),ballMaterials[type]);
 mesh.position.set(x,.29,z);mesh.castShadow=true;mesh.receiveShadow=true;
 scene.add(mesh);
 return {type,x,z,vx:0,vz:0,mesh,active:true};
}
function active(type){return balls.filter(b=>b.active&&b.type===type);}
function cueBall(){return active('Cue')[0];}
function required(){
 if(phase==='reds')return 'Red';
 if(phase==='colors')return 'Color';
 if(phase==='clearance')return colorOrder[clearanceIndex]||null;
 return null;
}
function label(t){
 return t==='Color'?'สีใดก็ได้':
 ({Red:'แดง',Yellow:'เหลือง',Green:'เขียว',Brown:'น้ำตาล',
 Blue:'น้ำเงิน',Pink:'ชมพู',Black:'ดำ'})[t]||'จบเฟรม';
}
function updateStatus(message){
 document.getElementById('s0').textContent=score[0];
 document.getElementById('s1').textContent=score[1];
 document.getElementById('turn').textContent='ผู้เล่น '+(player+1);
 document.getElementById('status').textContent=
 `ผู้เล่น ${player+1} • ต้องแทง ${label(required())} — ${message}`;
}
function resetGame(){
 for(const b of balls)scene.remove(b.mesh);
 balls=[];score=[0,0];player=0;phase='reds';reds=15;
 clearanceIndex=0;aimPoint=null;dragging=false;moving=false;
 shot=null;gameOver=false;anim=null;
 balls.push(makeBall('Cue',-5.55,1.0));
 for(let row=0;row<5;row++){
  for(let j=0;j<=row;j++){
   balls.push(makeBall('Red',3.2+row*.34,(j-row/2)*.37));
  }
 }
 for(const [type,p] of Object.entries(spots))
  balls.push(makeBall(type,p[0],p[1]));
 playerGroup.position.set(-6.9,.27,1.05);
 torso.rotation.z=-.08;
 arm.rotation.z=0;
 cue.visible=true;cueTip.visible=true;
 updateStatus('เริ่มเฟรมใหม่ ต้องแทงแดงก่อน');
}
function getAim(e){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const p=new THREE.Vector3();
 if(raycaster.ray.intersectPlane(aimPlane,p))return {x:p.x,z:p.z};
 return null;
}
function positionCue(){
 const c=cueBall();
 if(!c||!aimPoint){cue.visible=false;cueTip.visible=false;return;}
 const dx=aimPoint.x-c.x,dz=aimPoint.z-c.z;
 const len=Math.hypot(dx,dz)||1,ux=dx/len,uz=dz/len;
 const pull=Math.min(1.25,Math.max(0,Math.hypot(dx,dz)*.12));
 const back=anim?anim.pull:pull;
 const center=new THREE.Vector3(c.x-ux*(.38+back+1.95),.40,c.z-uz*(.38+back+1.95));
 const dir=new THREE.Vector3(ux,0,uz);
 cue.position.copy(center);
 cue.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
 cueTip.position.set(c.x-ux*(.30+back),.40,c.z-uz*(.30+back));
 cueTip.quaternion.copy(cue.quaternion);
 cue.visible=true;cueTip.visible=true;
}
function drawAim(){
 if(!aimPoint||moving||gameOver||!cueBall()){
  aimLine.visible=false;hitRing.visible=false;return;
 }
 const c=cueBall(),dx=aimPoint.x-c.x,dz=aimPoint.z-c.z;
 const len=Math.hypot(dx,dz)||1,ux=dx/len,uz=dz/len;
 let max=20;
 if(ux>0)max=Math.min(max,(innerX-c.x)/ux);
 if(ux<0)max=Math.min(max,(-innerX-c.x)/ux);
 if(uz>0)max=Math.min(max,(innerZ-c.z)/uz);
 if(uz<0)max=Math.min(max,(-innerZ-c.z)/uz);
 let nearest=null,dist=max;
 for(const b of balls){
  if(!b.active||b.type==='Cue')continue;
  const rx=b.x-c.x,rz=b.z-c.z,proj=rx*ux+rz*uz;
  const perp=Math.abs(rx*uz-rz*ux);
  if(proj>0&&proj<dist&&perp<ballRadius*2){nearest=b;dist=proj;}
 }
 const end=nearest?[nearest.x,nearest.z]:[c.x+ux*max,c.z+uz*max];
 aimLine.geometry.dispose();
 aimLine.geometry=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(c.x,.34,c.z),
  new THREE.Vector3(end[0],.34,end[1])
 ]);
 aimLine.computeLineDistances();aimLine.visible=true;
 hitRing.visible=!!nearest;
 if(nearest)hitRing.position.set(nearest.x,.32,nearest.z);
}
function syncBall(b){
 b.mesh.position.set(b.x,.29,b.z);
 // Roll the sphere as it travels
 const speed=Math.hypot(b.vx,b.vz);
 if(speed>.001){
  b.mesh.rotation.z+=b.vx*.06;
  b.mesh.rotation.x-=b.vz*.06;
 }
}
function pocket(b){
 b.active=false;b.mesh.visible=false;b.vx=b.vz=0;
 if(shot){
  if(b.type==='Cue')shot.scratch=true;
  else shot.potted.push(b.type);
 }
}
function physics(dt){
 if(!moving)return;
 let still=true;
 const step=Math.min(dt,.035)*60;
 for(const b of balls){
  if(!b.active)continue;
  b.x+=b.vx*step;b.z+=b.vz*step;
  const decay=Math.pow(.986,step);
  b.vx*=decay;b.vz*=decay;
  if(Math.hypot(b.vx,b.vz)>.012)still=false;
  else b.vx=b.vz=0;
  let dropped=false;
  for(const [px,pz] of pockets){
   if(Math.hypot(b.x-px,b.z-pz)<.34){pocket(b);dropped=true;break;}
  }
  if(dropped)continue;
  if(b.x < -innerX){b.x=-innerX;b.vx=Math.abs(b.vx)*.88;}
  if(b.x > innerX){b.x=innerX;b.vx=-Math.abs(b.vx)*.88;}
  if(b.z < -innerZ){b.z=-innerZ;b.vz=Math.abs(b.vz)*.88;}
  if(b.z > innerZ){b.z=innerZ;b.vz=-Math.abs(b.vz)*.88;}
 }
 const live=balls.filter(b=>b.active);
 for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
  const a=live[i],b=live[j],dx=b.x-a.x,dz=b.z-a.z;
  const d=Math.hypot(dx,dz),min=ballRadius*2;
  if(d<=0||d>=min)continue;
  if(a.type==='Cue'&&shot&&!shot.firstHit)shot.firstHit=b.type;
  if(b.type==='Cue'&&shot&&!shot.firstHit)shot.firstHit=a.type;
  const nx=dx/d,nz=dz/d,overlap=min-d;
  a.x-=nx*overlap/2;a.z-=nz*overlap/2;
  b.x+=nx*overlap/2;b.z+=nz*overlap/2;
  const rel=(a.vx-b.vx)*nx+(a.vz-b.vz)*nz;
  if(rel>0){
   const impulse=rel*.96;
   a.vx-=impulse*nx;a.vz-=impulse*nz;
   b.vx+=impulse*nx;b.vz+=impulse*nz;
  }
 }
 for(const b of balls)if(b.active)syncBall(b);
 if(still){moving=false;finishShot();}
}
function respot(type){
 const b=balls.find(q=>q.type===type&&!q.active);
 if(!b)return;
 const [x,z]=spots[type];b.active=true;b.x=x;b.z=z;b.vx=b.vz=0;
 b.mesh.visible=true;syncBall(b);
}
function respotList(list){
 for(const t of list)if(t!=='Red'&&t!=='Cue')respot(t);
}
function respotCue(){
 const c=balls.find(b=>b.type==='Cue');
 if(c){c.active=true;c.x=-5.55;c.z=1;c.vx=c.vz=0;c.mesh.visible=true;syncBall(c);}
}
function finishShot(){
 if(!shot)return;
 const s=shot;shot=null;
 const req=s.required,first=s.firstHit;
 let foul='';
 if(!first)foul='ไม่โดนลูกใดเลย';
 else if(req==='Color'&&(first==='Red'||!value[first]))foul='โดนลูกผิดก่อน';
 else if(req!=='Color'&&first!==req)foul='โดนลูกผิดก่อน';
 if(s.scratch)foul='ลูกขาวลงหลุม';
 const wrong=s.potted.some(t=>req==='Color'?t==='Red':t!==req);
 if(wrong)foul='แทงลูกผิดลงหลุม';
 const pot=s.potted.find(t=>req==='Color'?t!=='Red':t===req);
 if(foul){
  const penalty=Math.max(4,value[first]||0,value[req]||4);
  score[1-player]+=penalty;respotList(s.potted);
  if(s.scratch)respotCue();
  player=1-player;
  updateStatus(`ฟาวล์: ${foul} คู่แข่งได้ ${penalty} คะแนน`);
  return;
 }
 if(pot){
  score[player]+=value[pot];
  if(pot==='Red'){
   reds=Math.max(0,reds-1);
   phase='colors';
   updateStatus('แทงแดงลง! เลือกแทงสีใดก็ได้');
   return;
  }
  if(req==='Color'){
   if(reds>0){respot(pot);phase='reds';}
   else{phase='clearance';clearanceIndex=0;}
   updateStatus(reds>0?'แทงสีลง วางสีคืนแล้วกลับไปแทงแดง':'เริ่มเก็บสีตามลำดับ');
   return;
  }
  if(phase==='clearance'){
   clearanceIndex++;
   if(clearanceIndex>=colorOrder.length){
    gameOver=true;phase='over';
    updateStatus(`จบเฟรม! ${score[0]===score[1]?'คะแนนเสมอกัน':`ผู้เล่น ${score[0]>score[1]?1:2} ชนะ`}`);
    return;
   }
   updateStatus(`แทง ${label(pot)} ลง ได้ ${value[pot]} คะแนน`);
   return;
  }
 }
 // Miss: colors are respotted if they were potted on the wrong visit
 respotList(s.potted);player=1-player;
 updateStatus('แทงไม่ลง เปลี่ยนตา');
}
function shoot(){
 const c=cueBall();
 if(!c||!aimPoint||moving||gameOver)return;
 const dx=aimPoint.x-c.x,dz=aimPoint.z-c.z;
 const len=Math.hypot(dx,dz);
 if(len<.1)return;
 const power=Math.min(1.25,Math.max(.18,len*.14));
 shot={required:required(),firstHit:null,potted:[],scratch:false};
 c.vx=dx/len*power;c.vz=dz/len*power;
 moving=true;
 anim={time:0,duration:.48,pull:1.0};
 updateStatus('นักสนุกเกอร์กำลังแทง...');
}
renderer.domElement.addEventListener('pointerdown',e=>{
 if(moving||gameOver)return;
 const p=getAim(e);if(!p)return;
 aimPoint=p;dragging=true;
 renderer.domElement.setPointerCapture(e.pointerId);
 drawAim();positionCue();
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging||moving)return;
 const p=getAim(e);if(!p)return;
 aimPoint=p;drawAim();positionCue();
});
renderer.domElement.addEventListener('pointerup',e=>{
 if(!dragging)return;
 dragging=false;
 const p=getAim(e);if(p)aimPoint=p;
 shoot();drawAim();
});
renderer.domElement.addEventListener('pointercancel',()=>{
 dragging=false;aimPoint=null;drawAim();
});
document.getElementById('reset').addEventListener('click',resetGame);

function animatePlayer(dt){
 if(!anim){
  torso.rotation.z=THREE.MathUtils.lerp(torso.rotation.z,-.08,.08);
  arm.rotation.z=THREE.MathUtils.lerp(arm.rotation.z,0,.08);
  return;
 }
 anim.time+=dt;
 const t=anim.time/anim.duration;
 if(t<.45){
  anim.pull=1.0*(1-t/.45);
  torso.rotation.z=-.08-.15*(t/.45);
  arm.rotation.z=-.15*(t/.45);
 }else{
  const u=Math.min(1,(t-.45)/.55);
  anim.pull=-.15*u;
  torso.rotation.z=-.23+.15*u;
  arm.rotation.z=-.15+.20*u;
 }
 if(t>=1){anim=null;torso.rotation.z=-.08;arm.rotation.z=0;}
}
function resize(){
 const w=host.clientWidth,h=host.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
window.addEventListener('resize',resize);

function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.04);last=now;
 physics(dt);
 animatePlayer(dt);
 positionCue();drawAim();
 renderer.render(scene,camera);
}
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
